<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lojas Parceiras — BASP Representações</title>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jura:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0b09;--ivory:#f5f0e8;--gold:#d2af78;--gold-light:#e8d5a3;--gold-dark:#a8853a;--glass:rgba(245,240,232,0.04);--border:rgba(210,175,120,0.18);--border-strong:rgba(210,175,120,0.35);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ivory);font-family:'Crimson Pro',Georgia,serif;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px max(20px,4vw);border-bottom:1px solid var(--border)}
  header img{height:38px}
  header a.voltar{font-family:'Jura',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);text-decoration:none}
  main{max-width:1100px;margin:0 auto;padding:64px max(20px,4vw) 90px}
  .eyebrow{font-family:'Jura',sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
  h1{font-family:'Italiana',serif;font-weight:400;font-size:clamp(38px,6vw,64px);line-height:1.05;text-wrap:balance}
  .lede{font-size:20px;color:var(--gold-light);max-width:60ch;margin-top:16px;line-height:1.5}
  .busca{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:44px 0 36px}
  .campo{display:flex;flex-direction:column;gap:8px;min-width:0}
  .campo label{font-family:'Jura',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
  .campo select{font-family:'Jura',sans-serif;font-size:15px;color:var(--ivory);background:var(--glass);border:1px solid var(--border-strong);border-radius:10px;padding:14px 12px;width:100%}
  .campo select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .campo select option{background:#0d0b09;color:#f5f0e8}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{border:1px solid var(--border);border-radius:12px;background:var(--glass);padding:22px;display:flex;flex-direction:column;gap:14px;transition:border-color .25s,transform .25s}
  .card:hover{border-color:var(--border-strong);transform:translateY(-2px)}
  .card b{font-family:'Jura',sans-serif;font-size:17px;font-weight:600;letter-spacing:.03em;display:block}
  .card span{font-size:16px;color:var(--gold-light)}
  .card a{font-family:'Jura',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-decoration:none;align-self:flex-start;border-bottom:1px solid currentColor;padding-bottom:2px}
  .vazio{font-size:20px;color:var(--gold-light);line-height:1.5;max-width:60ch}
  .vazio a,.rodape a{color:var(--gold)}
  .rodape{margin-top:56px;padding-top:24px;border-top:1px solid var(--border);font-size:17px;color:var(--gold-light);line-height:1.6}
  @media(max-width:760px){.busca{grid-template-columns:1fr}}
  @media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header>
  <a href="index.html"><img src="basp-logo.png" alt="BASP"></a>
  <a class="voltar" href="index.html">Voltar ao site</a>
</header>

  <div class="busca">
    <div class="campo"><label for="fab">Fábrica</label><select id="fab"></select></div>
    <div class="campo"><label for="uf">Estado</label><select id="uf"></select></div>
    <div class="campo"><label for="cid">Cidade</label><select id="cid"></select></div>
  </div>
  <div id="res" aria-live="polite"></div>
  <p class="rodape">Não encontrou sua cidade? <a href="https://wa.me/5534991383001" target="_blank" rel="noopener">Fale com a BASP pelo WhatsApp</a> e indicamos a loja mais próxima.</p>

const fab=document.getElementById('fab'),uf=document.getElementById('uf'),cid=document.getElementById('cid'),res=document.getElementById('res');
const opt=(el,itens,todos)=>{el.innerHTML=(todos?'<option value="">'+todos+'</option>':'')+itens.map(([v,t])=>'<option value="'+v+'">'+t+'</option>').join('')};
opt(fab,Object.keys(LOJAS).sort((a,b)=>a.localeCompare(b)).map(f=>[f,f]));
const pedida=decodeURIComponent((location.hash||'').slice(1)).toLowerCase();
const achada=Object.keys(LOJAS).find(f=>f.toLowerCase().replace(/\s+/g,'-')===pedida); if(achada) fab.value=achada;
function ufs(){const d=LOJAS[fab.value]||{};opt(uf,['MG','GO','DF'].filter(u=>d[u]).map(u=>[u,UF[u]]),'Todos os estados');cidades()}
function cidades(){const d=LOJAS[fab.value]||{},l=[];for(const u of Object.keys(d)){if(uf.value&&u!==uf.value)continue;for(const c of Object.keys(d[u]))l.push([u+'|'+c,c+' · '+u])}l.sort((a,b)=>a[1].localeCompare(b[1]));opt(cid,l,'Todas as cidades');mostrar()}
function mostrar(){
  const d=LOJAS[fab.value]||{},cards=[];
  for(const u of Object.keys(d)){if(uf.value&&u!==uf.value)continue;for(const [c,ls] of Object.entries(d[u])){if(cid.value&&cid.value!==u+'|'+c)continue;for(const n of ls)cards.push([n,c,u])}}

}
